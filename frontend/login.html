<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Diario de Aprendizaje</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>

  <main id="login">
    <form class="login-box" id="loginForm" autocomplete="off">
      <div class="stack">
        <h1>Diario de aprendizaje</h1>
        <p>Revisa tu avance en el curso y conversa con tu tutor.</p>
      </div>
      <div class="field">
        <label for="uid" class="label">ID de estudiante</label>
        <input id="uid" inputmode="numeric" placeholder="Ej: 3" maxlength="12" required>
      </div>
      <div class="field">
        <label for="cid" class="label">ID de curso (Moodle)</label>
        <input id="cid" inputmode="numeric" placeholder="Ej: 3" value="5" maxlength="12" required>
        <p class="err" id="err" role="alert"></p>
      </div>
      <button class="btn" id="loginBtn" type="submit">Ingresar</button>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
